name: "EvalDelta regression gate"
description: "Budgeted, statistically valid paired regression test between a cached baseline and a candidate model."
branding:
  icon: "activity"
  color: "blue"
inputs:
  config:
    description: "Path to the EvalDelta YAML run config"
    required: true
  output-dir:
    description: "Directory for report.json / report.html / events.jsonl"
    default: "evaldelta-run"
  mode:
    description: "strict | allow-inconclusive | report-only"
    default: "strict"
  python-version:
    description: "Python version"
    default: "3.11"
  package:
    description: "Optional pip requirement; defaults to the code bundled with this Action"
    default: ""
outputs:
  decision:
    description: "confirmed_regression | evidence_of_noninferiority | inconclusive | evaluation_error"
    value: ${{ steps.run.outputs.decision }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install EvalDelta
      shell: bash
      env:
        EVALDELTA_PACKAGE: ${{ inputs.package }}
      run: |
        if [[ -n "$EVALDELTA_PACKAGE" ]]; then
          python -m pip install --quiet "$EVALDELTA_PACKAGE"
        else
          python -m pip install --quiet "$GITHUB_ACTION_PATH"
        fi
    - name: Run EvalDelta
      id: run
      shell: bash
      env:
        EVALDELTA_CONFIG: ${{ inputs.config }}
        EVALDELTA_OUTPUT_DIR: ${{ inputs.output-dir }}
        EVALDELTA_MODE: ${{ inputs.mode }}
      run: |
        set +e
        evaldelta compare --config "$EVALDELTA_CONFIG" --output "$EVALDELTA_OUTPUT_DIR" --mode "$EVALDELTA_MODE" | tail -n 1 > "$RUNNER_TEMP/evaldelta.json"
        code=${PIPESTATUS[0]}
        python -c "import json,sys; print('decision=' + json.load(open(sys.argv[1]))['decision'])" "$RUNNER_TEMP/evaldelta.json" >> "$GITHUB_OUTPUT" || echo "decision=evaluation_error" >> "$GITHUB_OUTPUT"
        exit $code
    - name: Upload EvalDelta report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: evaldelta-report
        path: ${{ inputs.output-dir }}
