name: "EvalDelta regression gate"
description: "Budgeted, statistically valid paired regression test between a cached baseline and a candidate model."
branding:
  icon: "activity"
  color: "blue"
inputs:
  config:
    description: "Path to the EvalDelta YAML run config"
    required: true
  output-dir:
    description: "Directory for report.json / report.html / events.jsonl"
    default: "evaldelta-run"
  mode:
    description: "strict | allow-inconclusive | report-only"
    default: "strict"
  python-version:
    description: "Python version"
    default: "3.11"
  package:
    description: "pip requirement for EvalDelta (a path, a git URL or a version spec)"
    default: "evaldelta"
outputs:
  decision:
    description: "confirmed_regression | evidence_of_noninferiority | inconclusive | evaluation_error"
    value: ${{ steps.run.outputs.decision }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install EvalDelta
      shell: bash
      run: python -m pip install --quiet "${{ inputs.package }}"
    - name: Run EvalDelta
      id: run
      shell: bash
      run: |
        set +e
        evaldelta compare --config "${{ inputs.config }}" --output "${{ inputs.output-dir }}" --mode "${{ inputs.mode }}" | tail -n 1 > "${{ runner.temp }}/evaldelta.json"
        code=${PIPESTATUS[0]}
        python -c "import json,sys; print('decision=' + json.load(open(sys.argv[1]))['decision'])" "${{ runner.temp }}/evaldelta.json" >> "$GITHUB_OUTPUT" || echo "decision=evaluation_error" >> "$GITHUB_OUTPUT"
        exit $code
    - name: Upload EvalDelta report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: evaldelta-report
        path: ${{ inputs.output-dir }}
